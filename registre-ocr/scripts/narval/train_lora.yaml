# LLaMA-Factory : LoRA sur Qwen3-VL-8B. Vérifier les clés avec la version installée (llamafactory-cli version).
model_name_or_path: ${SCRATCH}/models/Qwen3-VL-8B-Instruct
template: qwen3_vl            # qwen2_vl pour Qwen2.5-VL ; voir la liste des templates de LLaMA-Factory
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
freeze_vision_tower: true     # on adapte d'abord le décodeur ; dégeler la vision dans un second temps si utile

dataset_dir: ${SCRATCH}/registre_finetune
dataset: registre_train
eval_dataset: registre_val
cutoff_len: 2048
image_max_pixels: 1048576
preprocessing_num_workers: 8

output_dir: ${SCRATCH}/runs/registre_lora
logging_steps: 10
save_steps: 500
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500
report_to: none
